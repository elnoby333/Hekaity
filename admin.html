<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم حكايتي</title><link rel="stylesheet" href="styles.css"><style>.admin-wrap{padding:35px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:#fff;border:1px solid var(--line);padding:22px;border-radius:12px}.stat b{display:block;font-size:26px;color:var(--maroon)}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:20px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid input,.formgrid textarea,.formgrid select{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px}.formgrid textarea{min-height:90px;grid-column:1/-1}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right}.scroll{overflow:auto}@media(max-width:700px){.stats,.formgrid{grid-template-columns:1fr}}</style></head><body><div class="topbar"><span>لوحة تحكم حكايتي</span><a href="/">العودة للموقع</a></div><main class="container admin-wrap"><div class="section-head"><h2>لوحة التحكم</h2><button id="logout" class="outline">تسجيل الخروج</button></div><div class="stats"><div class="stat">الكتب<b id="booksCount">—</b></div><div class="stat">الطلبات<b id="ordersCount">—</b></div><div class="stat">المبيعات<b id="sales">—</b></div></div><section class="panel"><h2>إضافة كتاب</h2><form id="bookForm" class="formgrid"><input name="title" required placeholder="اسم الكتاب"><input name="author" required placeholder="المؤلف"><input name="price" type="number" required placeholder="السعر"><input name="stock" type="number" required placeholder="المخزون"><input name="category" required placeholder="التصنيف"><input name="isbn" placeholder="ISBN"><textarea name="description" placeholder="وصف الكتاب"></textarea><button class="primary" type="submit">إضافة الكتاب</button></form><p id="bookMsg"></p></section><section class="panel"><div class="section-head"><h2>الكتب</h2><button id="refreshBooks" class="outline">تحديث</button></div><div class="scroll"><table class="table"><thead><tr><th>الكتاب</th><th>المؤلف</th><th>السعر</th><th>المخزون</th><th>التصنيف</th><th>إجراء</th></tr></thead><tbody id="booksTable"></tbody></table></div></section><section class="panel"><h2>الطلبات</h2><div class="scroll"><table class="table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الإجمالي</th><th>الدفع</th><th>الشحن</th><th>تتبع</th><th>حفظ</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section></main><script>
const token=localStorage.getItem('hikayaty-admin-token');if(!token)location.href='/';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})}});if(r.status===401){localStorage.removeItem('hikayaty-admin-token');location.href='/';return}const d=await r.json();if(!r.ok)throw new Error(d.error||'خطأ');return d}
async function load(){const s=await api('/api/admin/stats');document.getElementById('booksCount').textContent=s.books;document.getElementById('ordersCount').textContent=s.orders;document.getElementById('sales').textContent=Number(s.sales).toFixed(0)+' ج.م';const b=await api('/api/books');document.getElementById('booksTable').innerHTML=b.map(x=>`<tr><td>${x.title}</td><td>${x.author}</td><td>${x.price} ج.م</td><td>${x.stock}</td><td>${x.category}</td><td><button onclick="del(${x.id})">إخفاء</button></td></tr>`).join('');const o=await api('/api/admin/orders');document.getElementById('ordersTable').innerHTML=o.map(x=>`<tr><td>${x.order_no}</td><td>${x.customer_name}<br>${x.phone}</td><td>${x.total} ج.م</td><td><select id="p${x.id}"><option ${x.payment_status==='pending'?'selected':''}>pending</option><option ${x.payment_status==='paid'?'selected':''}>paid</option><option ${x.payment_status==='failed'?'selected':''}>failed</option></select></td><td><select id="s${x.id}"><option ${x.shipping_status==='pending'?'selected':''}>pending</option><option ${x.shipping_status==='processing'?'selected':''}>processing</option><option ${x.shipping_status==='shipped'?'selected':''}>shipped</option><option ${x.shipping_status==='delivered'?'selected':''}>delivered</option></select></td><td><input id="t${x.id}" value="${x.tracking_no||''}" placeholder="Tracking"></td><td><button onclick="saveOrder(${x.id})">حفظ</button></td></tr>`).join('')}
async function del(id){if(confirm('إخفاء الكتاب؟')){await api('/api/admin/books/'+id,{method:'DELETE'});load()}}async function saveOrder(id){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({payment_status:document.getElementById('p'+id).value,shipping_status:document.getElementById('s'+id).value,tracking_no:document.getElementById('t'+id).value})});alert('تم الحفظ')}
document.getElementById('bookForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/books',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target).entries()))});e.target.reset();document.getElementById('bookMsg').textContent='تمت إضافة الكتاب';load()}catch(x){document.getElementById('bookMsg').textContent=x.message}};document.getElementById('refreshBooks').onclick=load;document.getElementById('logout').onclick=()=>{localStorage.removeItem('hikayaty-admin-token');location.href='/'};load();
</script></body></html>
